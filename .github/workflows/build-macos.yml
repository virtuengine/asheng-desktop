name: build-macos

on:
  workflow_dispatch:

env:
  # 模型直接从我们自己的服务器取，避免 CI 访问 HuggingFace 不稳定
  CDN: https://43.142.55.26:8668/dl/desktop
  PACK_VERSION: 1.2.0

jobs:
  # 分别产出 Apple Silicon 与 Intel 的语音模块，客户端按芯片下载对应的一份
  asr-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install "sherpa-onnx==2.0.1" sounddevice numpy pyinstaller

      - name: Fetch models
        run: |
          curl -fL --retry 3 --retry-delay 5 -o vp.zip "$CDN/voice-pack-$PACK_VERSION.zip"
          mkdir -p asr-host/models
          unzip -o -q vp.zip 'models/*' -d asr-host/
          ls -lh asr-host/models/vad asr-host/models/voice

      - name: Build asr-host
        run: |
          python -m PyInstaller asr-host/asr_host.py --name asr-host --noconfirm --clean \
            --collect-all sherpa_onnx --collect-all sounddevice --distpath dist

      - name: Pack
        run: |
          mkdir -p pack/asr
          cp -R dist/asr-host/* pack/asr/
          cp -R asr-host/models pack/asr/models
          chmod +x pack/asr/asr-host
          cd pack && zip -q -r -y "../voice-pack-mac-${{ matrix.arch }}.zip" asr
          cd ..
          shasum -a 256 "voice-pack-mac-${{ matrix.arch }}.zip" | tee sha-${{ matrix.arch }}.txt
          du -sh "voice-pack-mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: voice-pack-mac-${{ matrix.arch }}
          path: voice-pack-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Build universal dmg
        run: >
          npx tauri build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: asheng-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
