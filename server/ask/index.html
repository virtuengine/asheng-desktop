<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿盛 · 桌面助手</title>
<style>
  :root{
    --asg-cyan:#0fa3a3; --asg-ink:#15222c; --asg-muted:#6b7f90; --asg-line:#e2e9ef;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#fff;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--asg-ink)}
  #asgRoot{position:fixed;inset:0;z-index:10;display:block}
  #asgPanel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
    width:100%;height:100%;background:#fff;border:0;border-radius:0;box-shadow:none;
    opacity:1;transform:none;pointer-events:auto}
  #asgPanel .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid #edf2f6;background:linear-gradient(180deg,rgba(15,163,163,.07),rgba(255,255,255,0))}
  #asgPanel .av{width:36px;height:36px;border-radius:50%;display:block;flex:0 0 auto;object-fit:contain;
    background:#fff;padding:2px;box-shadow:inset 0 0 0 1px rgba(15,163,163,.18),0 2px 6px rgba(10,124,133,.12)}
  #asgPanel .nm{font-size:14.5px;font-weight:700;color:var(--asg-ink);letter-spacing:.2px}
  #asgPanel .st{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#16a34a}
  #asgPanel .st i{width:6px;height:6px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
  #asgPanel .snd{width:30px;height:30px;border-radius:50%;border:1px solid #e6edf2;background:#fff;
    color:#5b7285;cursor:pointer;display:grid;place-items:center;padding:0}
  #asgPanel .snd:hover{color:#0b7f88;border-color:#bfe0e3}
  #asgPanel .snd.off{color:#bfcbd5}
  #asgPanel .x{width:30px;height:30px;border-radius:50%;border:1px solid #e6edf2;background:#fff;
    color:#7a8ea0;cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;padding:0}
  #asgPanel .x:hover{color:#15222c;border-color:#cfdbe3}

  #asgReports{display:none;padding:10px 16px 0}
  #asgReports.on{display:block}
  #asgReports button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;
    border:1px solid #cfe7e9;background:#f2fbfb;border-radius:11px;color:#0b6d74;
    font-size:12px;cursor:pointer;font-family:inherit;text-align:left}
  #asgReports button:hover{background:#e9f8f9}
  #asgReports .tag{font-size:10.5px;font-weight:700;color:#0b7f88;background:#d9f2f3;
    border-radius:6px;padding:1px 6px}
  #asgReports .ar{margin-left:auto;color:#7a8ea0;font-size:11px}

  #asgAlerts{display:none;padding:10px 16px 0}
  #asgAlerts.on{display:block}
  #asgAlerts .it{display:flex;gap:8px;align-items:flex-start;padding:9px 8px 9px 11px;margin-bottom:6px;
    border:1px solid #f3d4d4;background:#fff7f7;border-radius:11px}
  #asgAlerts .it .txt{flex:1;min-width:0}
  #asgAlerts .it b{display:inline-block;font-size:10.5px;font-weight:700;color:#c92a2a;background:#ffe3e3;
    border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
  #asgAlerts .it span{font-size:12px;color:#5a3a3a;line-height:1.6}
  #asgAlerts .it .ax{flex:0 0 auto;width:20px;height:20px;border:0;border-radius:50%;background:transparent;
    color:#b08a8a;font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
  #asgAlerts .it .ax:hover{background:#ffe3e3;color:#c92a2a}

  #asgMsgs{flex:1;overflow-y:auto;padding:16px 16px 8px;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin}
  #asgMsgs::-webkit-scrollbar{width:5px}
  #asgMsgs::-webkit-scrollbar-thumb{background:#e2e9ef;border-radius:99px}
  .asg-time{text-align:center;font-size:10.5px;color:#9aabb9;margin:6px 0 14px;letter-spacing:.3px}
  .asg-row{display:flex;margin-bottom:12px}
  .asg-row.u{justify-content:flex-end}
  .asg-b{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.7;
    color:#1d2c38;background:#f5f8fa;border:1px solid #edf2f6;word-break:break-word}
  .asg-b .md-table{overflow-x:auto;margin:6px 0}
  .asg-b table{border-collapse:collapse;width:100%;font-size:12.5px}
  .asg-b th,.asg-b td{border:1px solid #e6edf2;padding:5px 8px;text-align:left;white-space:nowrap}
  .asg-b th{background:#eef7f8;color:#2b4a55;font-weight:600}
  .asg-b th:last-child,.asg-b td:last-child{text-align:right}
  .asg-b .md-chart{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .asg-b .md-bar{display:flex;align-items:center;gap:8px;font-size:12px}
  .asg-b .md-bar .lb{flex:0 0 70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4b6070}
  .asg-b .md-bar .tr{flex:1;height:8px;background:#e9f1f4;border-radius:99px;overflow:hidden}
  .asg-b .md-bar .tr i{display:block;height:100%;background:linear-gradient(90deg,#1ab6b6,#0a7c85);border-radius:99px}
  .asg-b .md-bar .vl{flex:0 0 auto;color:#1d2c38;font-weight:600}
  .asg-b .md-h1,.asg-b .md-h2,.asg-b .md-h3{font-weight:700;margin:8px 0 4px}
  .asg-b .md-h1{font-size:15px}
  .asg-b .md-h2{font-size:14px}
  .asg-b .md-h3{font-size:13px}
  .asg-b p{margin:0 0 6px}
  .asg-b p:last-child{margin-bottom:0}
  .asg-b ul,.asg-b ol{margin:4px 0 6px;padding-left:18px}
  .asg-b li{margin:2px 0}
  .asg-b code{background:#eef3f6;border-radius:4px;padding:1px 4px;font-size:12px}
  .asg-b pre{background:#0f2430;color:#d6e6ee;border-radius:8px;padding:8px 10px;overflow:auto;font-size:12px;margin:6px 0}
  .asg-row.u .asg-b{background:#0fa3a3;border-color:#0fa3a3;color:#fff;border-bottom-right-radius:5px}
  .asg-row:not(.u) .asg-b{border-bottom-left-radius:5px}
  .asg-typing{display:inline-flex;gap:4px;align-items:center;height:18px}
  .asg-typing i{width:5px;height:5px;border-radius:50%;background:#9fb2c1;animation:asgDot 1.1s ease-in-out infinite}
  .asg-typing i:nth-child(2){animation-delay:.15s}
  .asg-typing i:nth-child(3){animation-delay:.3s}
  @keyframes asgDot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-3px);opacity:1}}

  .asg-note-btn{margin:-6px 0 10px;border:1px solid #e2e9ef;background:#fff;color:#7a8ea0;
    border-radius:999px;padding:2px 9px;font-size:10.5px;cursor:pointer;font-family:inherit}
  .asg-note-btn:hover{border-color:#bfe0e3;color:#0b7f88;background:#f4fbfb}

  #asgChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
  #asgChips button{border:1px solid #e2e9ef;background:#fff;color:#3d5364;border-radius:999px;
    padding:6px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
  #asgChips button:hover{border-color:rgba(15,163,163,.4);color:#0b7f88;background:#f4fbfb}

  #asgInputWrap{position:relative;padding:10px 14px 12px;border-top:1px solid #edf2f6;background:#fff}
  #asgField{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;
    border:1px solid #dce4ea;border-radius:24px;background:#f7fafb;transition:border-color .2s ease,background .2s ease}
  #asgField.focus{border-color:rgba(15,163,163,.55);background:#fff;box-shadow:0 0 0 3px rgba(15,163,163,.08)}
  #asgInput{flex:1;resize:none;border:0;outline:none;background:transparent;color:var(--asg-ink);
    font-family:inherit;font-size:14px;line-height:24px;min-height:24px;max-height:96px;padding:0;overflow-y:hidden}
  #asgInput::placeholder{color:#9aabb9}
  #asgSend{width:34px;height:34px;flex:0 0 auto;border:0;border-radius:50%;background:#0fa3a3;
    color:#fff;cursor:pointer;display:grid;place-items:center}
  #asgSend:hover{background:#0b8b92}
  #asgSend:disabled{background:#e3eaef;color:#adbcc8;cursor:default}

  #asgNote{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;padding:16px;background:#fff;z-index:6}
  #asgNote.on{display:flex}
  #asgNote h4{margin:0;font-size:14px;color:var(--asg-ink)}
  #asgNote p{margin:0;font-size:11.5px;color:#7a8ea0;line-height:1.6}
  #asgNote textarea{flex:1;min-height:110px;border:1px solid #dce4ea;border-radius:12px;padding:10px 12px;
    font-family:inherit;font-size:14px;resize:none;outline:none;color:var(--asg-ink);background:#f9fbfc}
  #asgNote textarea:focus{border-color:rgba(15,163,163,.55);background:#fff}
  #asgNote .row{display:flex;gap:8px;align-items:center;font-size:12px;color:#5b7285;flex-wrap:wrap}
  #asgNote input,#asgNote select{border:1px solid #dce4ea;border-radius:8px;padding:6px 8px;
    font-family:inherit;font-size:12px;background:#fff;color:var(--asg-ink)}
  #asgNote input{width:120px}
  #asgNote .acts{display:flex;gap:8px;justify-content:flex-end}
  #asgNote button{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer}
  #asgNote .ok{background:#0fa3a3;color:#fff}
  #asgNote .no{background:#eef3f6;color:#3d5364}

</style>
</head>
<body>
<div id="asgRoot">
  <section id="asgPanel" aria-label="阿盛对话面板">
    <div class="hd">
      <img class="av" src="/asg-logo.png" alt="阿盛">
      <div class="nm">阿盛</div>
      <span class="st"><i></i>在线</span>
      <button class="snd" id="asgSnd" title="提示音：开" aria-label="提示音开关">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
      </button>
      <button class="x" id="asgClose" title="关闭" aria-label="关闭">×</button>
    </div>
    <div id="asgReports"></div>
    <div id="asgAlerts"></div>
    <div id="asgMsgs"></div>
    <div id="asgChips">
      <button data-q="今天压型线产量多少？">今天产量</button>
      <button data-q="今天两条线良率怎么样？">今日良率</button>
      <button data-q="哪些设备离线了？">离线设备</button>
      <button data-q="今天缺陷排名前五是什么？">缺陷 Top 5</button>
    </div>
    <div id="asgInputWrap">
      <div id="asgField">
        <textarea id="asgInput" rows="1" placeholder="问阿盛…"></textarea>
        <button id="asgSend" title="发送" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="asgNote">
      <h4>补充现场说明</h4>
      <p>记录换模、检修、停电、原料异常等情况。系统会保存成备忘录，后续分析异常时作为解释引用，到期自动失效。</p>
      <textarea id="asgNoteText" placeholder="例如：Dalian-ceshi 今天换模，预计停到明天上午，良率偏低属正常"></textarea>
      <div class="row">
        <span>设备号（可空）</span>
        <input id="asgNoteStation" placeholder="如 Dalian-2">
        <span>有效期</span>
        <select id="asgNoteDays">
          <option value="3">3 天</option>
          <option value="7" selected>7 天</option>
          <option value="30">30 天</option>
        </select>
      </div>
      <div class="acts">
        <button type="button" class="no" id="asgNoteCancel">取消</button>
        <button type="button" class="ok" id="asgNoteSave">提交说明</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------------- 登录态：阿盛跟随 ERP 登录，不单独登录 ---------------- */
(function(){
  var TOKEN_KEY='sf-erp-token';

  function expOf(t){
    try{
      var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      var o=JSON.parse(decodeURIComponent(escape(atob(p))));
      return (o&&o.exp)?o.exp*1000:0;
    }catch(e){ return 0; }
  }
  function token(){
    var t=localStorage.getItem(TOKEN_KEY)||'';
    if(!t) return '';
    var exp=expOf(t);
    if(exp && exp < Date.now()+60000){ localStorage.removeItem(TOKEN_KEY); return ''; }
    return t;
  }
  window.sfToken=token;
  window.sfAuthHead=function(){ var t=token(); return t?{'Authorization':'Bearer '+t}:{}; };
  window.askHasLogin=function(){ return !!token(); };

  function deskSession(t){
    return fetch('/api/desk-session',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:t})
    });
  }

  var current=token();
  if(current) deskSession(current).catch(function(){});

  window.addEventListener('focus',function(){
    var t=token();
    if(!t){ location.href='/ask/focus-main'; return; }
    window.dispatchEvent(new CustomEvent('ask-auth',{detail:true}));
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) window.dispatchEvent(new Event('focus'));
  });
})();

/* ---------------- 阿盛对话 ---------------- */
(function(){
  var root=document.getElementById('asgRoot'), panel=document.getElementById('asgPanel');
  var msgs=document.getElementById('asgMsgs'), input=document.getElementById('asgInput');
  var field=document.getElementById('asgField'), sendBtn=document.getElementById('asgSend');
  var alertBox=document.getElementById('asgAlerts');
  var reportBox=document.getElementById('asgReports');
  var sndBtn=document.getElementById('asgSnd');
  var SND='asg_sound', soundOn=(localStorage.getItem(SND)||'1')!=='0', actx=null;
  var lastAlertN=null, lastReportN=null;

  function sfx(kind){
    if(!soundOn) return;
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return;
      actx=actx||new C();
      if(actx.state==='suspended') actx.resume();
      var seq = kind==='send'  ? [[660,0.06]] :
                kind==='reply' ? [[740,0.09],[988,0.11]] :
                kind==='alert' ? [[520,0.08],[520,0.08]] : [[620,0.07]];
      var t=actx.currentTime;
      seq.forEach(function(p){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=p[0];
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(kind==='alert'?0.07:0.05,t+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+p[1]+0.02);
        t+=p[1]+0.06;
      });
    }catch(e){}
  }
  function paintSnd(){
    sndBtn.classList.toggle('off', !soundOn);
    sndBtn.title = soundOn ? '提示音：开' : '提示音：关';
  }
  sndBtn.addEventListener('click',function(){
    soundOn=!soundOn;
    try{ localStorage.setItem(SND, soundOn?'1':'0'); }catch(e){}
    paintSnd();
    if(soundOn) sfx('send');
  });

  var LS='asg_history_v1', history=[], busy=false;
  var alerts=[], alertTimer=null, reports=[], reportTimer=null;
  var OFF='asg_alert_off_v1';
  function dismissedAlerts(){
    try{
      var raw=JSON.parse(localStorage.getItem(OFF)||'[]')||[];
      var cut=Date.now()-7*86400000;
      return raw.filter(function(o){ return o && o.id && o.ts>cut; });
    }catch(e){ return []; }
  }
  function dismissAlert(id){
    var list=dismissedAlerts();
    list.push({id:id, ts:Date.now()});
    try{ localStorage.setItem(OFF, JSON.stringify(list.slice(-200))); }catch(e){}
  }

  var GREETINGS=[
    '{greet}，我是阿盛，盛峰门业信息官。生产、质量、设备上的问题，直接问。',
    '{greet}。阿盛在，产量、良率、设备异常都可以问。',
    '{greet}，我是阿盛。先看压型线还是筷子线？',
    '{greet}，阿盛在线。要查数据、看异常，直接说。',
    '{greet}，我是阿盛。今天的生产情况需要我帮你过一遍吗？',
    '{greet}。阿盛在，设备、质量、产量，有问题就问我。',
    '{greet}，我是阿盛，盛峰门业信息官。数据、异常、原因分析都可以直接问。'
  ];
  function timeWord(){
    var h=new Date().getHours();
    if(h<5) return '夜深了';
    if(h<11) return '早上好';
    if(h<13) return '中午好';
    if(h<18) return '下午好';
    return '晚上好';
  }
  function pickGreeting(){
    var t=GREETINGS[Math.floor(Math.random()*GREETINGS.length)];
    return t.replace('{greet}',timeWord());
  }
  var line='press';

  function load(){
    try{ history=JSON.parse(localStorage.getItem(LS)||'[]')||[]; }catch(e){ history=[]; }
    var cut=Date.now()-7*86400000;
    history=history.filter(function(m){return m&&m.ts&&m.ts>cut&&m.content;});
    history.forEach(function(m){
      if(m.role==='assistant'&&typeof m.content==='string') m.content=m.content.replace(/^我是阿胜/,'我是阿盛');
    });
    if(!history.length){
      history=[{role:'assistant',content:pickGreeting(),ts:Date.now(),note:0}];
    }else if(history[0].role==='assistant'&&history[0].note===undefined){
      history[0].note=0;
    }
  }
  function save(){
    try{ localStorage.setItem(LS, JSON.stringify(history.slice(-100))); }catch(e){}
  }
  function fmt(ts){
    var d=new Date(ts), n=new Date();
    var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    if(d.toDateString()===n.toDateString()) return hm;
    var y=new Date(n.getTime()-86400000);
    if(d.toDateString()===y.toDateString()) return '昨天 '+hm;
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function inlineMd(s){
    return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function tableHtml(head,rows){
    var h='<div class="md-table"><table><thead><tr>';
    head.forEach(function(c){ h+='<th>'+inlineMd(c)+'</th>'; });
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr>';
      r.forEach(function(c){ h+='<td>'+inlineMd(c)+'</td>'; });
      h+='</tr>';
    });
    return h+'</tbody></table></div>';
  }
  function chartHtml(lines){
    var data=[];
    lines.forEach(function(l){
      var p=l.split('|');
      if(p.length<2) return;
      var v=parseFloat(String(p[1]).replace(/[^\d.\-]/g,''));
      if(isNaN(v)) return;
      data.push({label:p[0].trim(), v:v, raw:p[1].trim()});
    });
    if(!data.length) return '<pre>'+esc(lines.join('\n'))+'</pre>';
    var max=Math.max.apply(null,data.map(function(d){return d.v;}))||1;
    var rows=data.map(function(d){
      var w=Math.max(2,Math.round(d.v/max*100));
      return '<div class="md-bar"><span class="lb">'+esc(d.label)+'</span>'+
             '<span class="tr"><i style="width:'+w+'%"></i></span>'+
             '<span class="vl">'+esc(d.raw)+'</span></div>';
    }).join('');
    return '<div class="md-chart">'+rows+'</div>';
  }
  function rich(text){
    var lines=String(text||'').split(/\r?\n/), out=[], i=0;
    while(i<lines.length){
      var line=lines[i];
      if(/^```/.test(line)){
        var lang=line.replace(/^```/,'').trim(), buf=[];
        i++;
        while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        out.push(lang==='chart' ? chartHtml(buf) : '<pre>'+esc(buf.join('\n'))+'</pre>');
        continue;
      }
      if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1])){
        var head=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(s){return s.trim();});
        i+=2;
        var rows=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){
          rows.push(lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(s){return s.trim();}));
          i++;
        }
        out.push(tableHtml(head,rows));
        continue;
      }
      var m=line.match(/^(#{1,3})\s+(.*)$/);
      if(m){ out.push('<div class="md-h'+m[1].length+'">'+inlineMd(m[2])+'</div>'); i++; continue; }
      if(/^\s*[-*]\s+/.test(line)){
        var items=[];
        while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
        out.push('<ul>'+items.map(function(t){return '<li>'+inlineMd(t)+'</li>';}).join('')+'</ul>');
        continue;
      }
      if(/^\s*\d+[.)]\s+/.test(line)){
        var nums=[];
        while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ nums.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; }
        out.push('<ol>'+nums.map(function(t){return '<li>'+inlineMd(t)+'</li>';}).join('')+'</ol>');
        continue;
      }
      if(!line.trim()){ i++; continue; }
      var para=[line];
      i++;
      while(i<lines.length && lines[i].trim() && !/^```/.test(lines[i]) && !/^\s*\|/.test(lines[i]) &&
            !/^#{1,3}\s+/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+[.)]\s+/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      out.push('<p>'+para.map(inlineMd).join('<br>')+'</p>');
    }
    return out.join('');
  }
  function scroll(){ msgs.scrollTop=msgs.scrollHeight; }
  function render(){
    msgs.innerHTML='';
    for(var i=0;i<history.length;i++){
      var m=history[i];
      if(i===0||m.ts-history[i-1].ts>300000){
        var t=document.createElement('div'); t.className='asg-time'; t.textContent=fmt(m.ts); msgs.appendChild(t);
      }
      var row=document.createElement('div');
      row.className='asg-row'+(m.role==='user'?' u':'');
      var b=document.createElement('div'); b.className='asg-b'; b.innerHTML=rich(m.content);
      row.appendChild(b); msgs.appendChild(row);
      if(m.role!=='user'&&m.note!==0){
        var nb=document.createElement('button');
        nb.type='button'; nb.className='asg-note-btn'; nb.textContent='补充说明';
        nb.addEventListener('click',openNote);
        msgs.appendChild(nb);
      }
    }
    scroll();
  }
  function typing(){
    var row=document.createElement('div'); row.className='asg-row';
    var b=document.createElement('div'); b.className='asg-b';
    b.innerHTML='<span class="asg-typing"><i></i><i></i><i></i></span>';
    row.appendChild(b); msgs.appendChild(row); scroll();
  }

  var noteBox=document.getElementById('asgNote');
  var noteText=document.getElementById('asgNoteText');
  var noteStation=document.getElementById('asgNoteStation');
  var noteDays=document.getElementById('asgNoteDays');
  function openNote(){
    noteBox.classList.add('on');
    noteText.value='';
    noteStation.value='';
    setTimeout(function(){ noteText.focus(); },80);
  }
  function closeNote(){ noteBox.classList.remove('on'); }
  document.getElementById('asgNoteCancel').addEventListener('click',closeNote);
  document.getElementById('asgNoteSave').addEventListener('click',function(){
    var text=(noteText.value||'').trim();
    if(!text){ noteText.focus(); return; }
    fetch('/agent-api/notes',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        content:text, line:line,
        station:(noteStation.value||'').trim(),
        days:parseInt(noteDays.value,10)||7
      })
    }).then(function(r){ return r.ok?r.json():null; }).then(function(d){
      closeNote();
      if(d&&d.ok){
        history.push({role:'assistant',content:'已记录这条现场说明，后续分析会作为解释引用，到期自动失效。',ts:Date.now(),note:0});
        sfx('send'); render(); save();
      }else{
        history.push({role:'assistant',content:'说明保存失败，请稍后再试。',ts:Date.now(),note:0});
        render(); save();
      }
    }).catch(function(){
      history.push({role:'assistant',content:'说明保存失败，请稍后再试。',ts:Date.now(),note:0});
      render(); save();
    });
  });

  function paintAlerts(){
    var off=dismissedAlerts();
    var list=alerts.filter(function(a){
      return !off.some(function(o){ return o.id===a.id; });
    });
    if(!list.length){ alertBox.className=''; alertBox.innerHTML=''; return; }
    alertBox.className='on';
    alertBox.innerHTML='';
    list.slice(0,3).forEach(function(a){
      var it=document.createElement('div'); it.className='it';
      var txt=document.createElement('div'); txt.className='txt';
      var b=document.createElement('b'); b.textContent=(a.level==='info'?'已知':'异常');
      if(a.level==='info') b.style.background='#e6f4f1', b.style.color='#0b7f6b';
      var s=document.createElement('span'); s.textContent=(a.title||'')+(a.detail?'：'+a.detail:'');
      txt.appendChild(b); txt.appendChild(s);

      var x=document.createElement('button');
      x.type='button'; x.className='ax'; x.textContent='×';
      x.title='忽略此告警'; x.setAttribute('aria-label','忽略此告警');
      x.addEventListener('click',function(ev){
        ev.stopPropagation();
        dismissAlert(a.id);
        paintAlerts();
        fetch('/agent-api/alerts/'+a.id+'/mute',{method:'POST',credentials:'same-origin',
          headers:window.sfAuthHead?window.sfAuthHead():{}}).catch(function(){});
      });
      it.appendChild(txt); it.appendChild(x);
      alertBox.appendChild(it);
    });
  }
  function pollAlerts(){
    fetch('/agent-api/alerts',{credentials:'same-origin',
      headers:Object.assign({'Accept':'application/json'}, window.sfAuthHead?window.sfAuthHead():{})})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(!d) return;
        alerts=d.items||[];
        paintAlerts();
        var off=dismissedAlerts();
        var n=alerts.filter(function(a){ return !off.some(function(o){ return o.id===a.id; }); }).length;
        if(lastAlertN!==null && n>lastAlertN) sfx('alert');
        lastAlertN=n;
      })
      .catch(function(){});
  }

  function pollReports(){
    fetch('/agent-api/reports?limit=1',{credentials:'same-origin',
      headers:Object.assign({'Accept':'application/json'}, window.sfAuthHead?window.sfAuthHead():{})})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(!d) return;
        reports=(d.items||[]).filter(function(x){ return !x.read; });
        paintReports();
        if(lastReportN!==null && reports.length>lastReportN) sfx('alert');
        lastReportN=reports.length;
      })
      .catch(function(){});
  }
  function paintReports(){
    var r=reports[0];
    if(!r){ reportBox.className=''; reportBox.innerHTML=''; return; }
    reportBox.className='on'; reportBox.innerHTML='';
    var btn=document.createElement('button'); btn.type='button';
    var tag=document.createElement('span'); tag.className='tag'; tag.textContent=(r.level==='weekly'?'周报':'日报');
    var tt=document.createElement('span'); tt.textContent=r.title||'生产简报';
    var ar=document.createElement('span'); ar.className='ar'; ar.textContent='查看';
    btn.appendChild(tag); btn.appendChild(tt); btn.appendChild(ar);
    btn.addEventListener('click',function(){
      history.push({role:'assistant',content:r.content,ts:Date.now(),note:1});
      render(); save();
      reports.shift(); paintReports();
      fetch('/agent-api/reports/'+r.id+'/read',{method:'POST',credentials:'same-origin',
        headers:window.sfAuthHead?window.sfAuthHead():{}}).catch(function(){});
    });
    reportBox.appendChild(btn);
  }

  function syncSend(){
    sendBtn.disabled = busy || !(input.value||'').trim();
  }

  function ask(){
    var text=(input.value||'').trim();
    if(!text||busy) return;
    input.value=''; input.style.height='24px'; input.style.overflowY='hidden'; busy=true; syncSend();
    history.push({role:'user',content:text,ts:Date.now()});
    sfx('send');
    render(); typing();
    var payload=history.slice(-8).map(function(m){return {role:m.role,content:m.content};});
    fetch('/agent-api/chat',{
      method:'POST',credentials:'same-origin',
      headers:Object.assign({'Content-Type':'application/json'}, window.sfAuthHead?window.sfAuthHead():{}),
      body:JSON.stringify({
        message:text,page:'桌面阿盛',line:line,
        date:new Date().toISOString().slice(0,10),
        history:payload
      })
    }).then(function(r){
      if(r.status===401){
        location.href='/ask/focus-main';
        throw new Error('登录状态已失效，请重新登录。');
      }
      return r.json();
    }).then(function(d){
      var reply=(d&&d.reply)||'我没有查到可用的数据。';
      var nf=(d&&typeof d.note==='number')?d.note:1;
      history.push({role:'assistant',content:reply,ts:Date.now(),note:nf});
      sfx('reply');
      render(); save();
    }).catch(function(e){
      history.push({role:'assistant',content:(e&&e.message)||'连接失败，请稍后再试。',ts:Date.now(),note:0});
      render(); save();
    }).finally(function(){ busy=false; syncSend(); });
  }

  input.addEventListener('input',function(){
    input.style.height='24px';
    input.style.height=Math.min(input.scrollHeight,96)+'px';
    input.style.overflowY=input.scrollHeight>96?'auto':'hidden';
    syncSend();
  });
  input.addEventListener('focus',function(){ field.classList.add('focus'); });
  input.addEventListener('blur',function(){ field.classList.remove('focus'); });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask();}
  });
  document.querySelectorAll('#asgChips button').forEach(function(btn){
    btn.addEventListener('click',function(){ input.value=btn.getAttribute('data-q'); input.focus(); syncSend(); });
  });
  sendBtn.addEventListener('click',function(){ ask(); });

  /* 关闭按钮：走壳约定的 /ask/close，由客户端直接收起小窗 */
  var closeBtn=document.getElementById('asgClose');
  if(closeBtn){
    closeBtn.addEventListener('click',function(){
      try{ location.href='/ask/close'; }catch(e){}
    });
  }

  load(); render(); syncSend(); paintSnd();
  var polling=false;
  function startPolling(){
    if(polling) return;
    polling=true;
    pollAlerts(); pollReports();
    alertTimer=setInterval(pollAlerts,60000);
    reportTimer=setInterval(pollReports,300000);
  }
  window.addEventListener('ask-auth',startPolling);
  if(window.sfToken && window.sfToken()) startPolling();
  window.addEventListener('beforeunload',function(){
    if(alertTimer) clearInterval(alertTimer);
    if(reportTimer) clearInterval(reportTimer);
  });
})();
</script>
</body>
</html>
