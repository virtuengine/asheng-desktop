<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阿盛</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    display:grid;place-items:center;
    -webkit-user-select:none;user-select:none}
  #ball{
    width:72px;height:72px;border-radius:50%;cursor:pointer;position:relative;
    display:grid;place-items:center;
    background:radial-gradient(circle at 34% 26%, #ffffff 0%, #f2fbfc 44%, #d5eff2 100%);
    border:1px solid rgba(15,163,163,.42);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,.95),
      inset 0 -8px 14px rgba(11,111,114,.16),
      0 2px 5px rgba(20,35,60,.14),
      0 8px 18px rgba(15,140,150,.18);
    animation:asgBreath 3.8s ease-in-out infinite;
    transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
  }
  #ball:hover{
    animation:none;
    transform:scale(1.03);
    filter:brightness(1.03);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,.95),
      inset 0 -8px 14px rgba(11,111,114,.10),
      inset 0 0 16px 2px rgba(15,163,163,.28),
      0 4px 10px rgba(20,35,60,.18),
      0 14px 28px rgba(15,140,150,.26);
  }
  /* 素材是白底不透明，用正片叠底把白底去掉；眼睛层跟着同样的位移/倾斜走 */
  #ball img{
    width:52px;height:52px;object-fit:contain;pointer-events:none;-webkit-user-drag:none;
    mix-blend-mode:multiply;
    transform:translate3d(calc(var(--hx,0)*1px),calc(var(--hy,0)*1px),0) rotate(calc(var(--hr,0)*1deg)) scale(var(--hs,1));
    transition:transform .12s ease-out;
  }
  #ball:hover{--hs:1.06}
  /* 分层眼睛：眼窝盖住原图上的静态眼睛，瞳孔跟随鼠标 */
  #ball .face{
    position:absolute;inset:0;pointer-events:none;
    transform:translate3d(calc(var(--hx,0)*1px),calc(var(--hy,0)*1px),0) rotate(calc(var(--hr,0)*1deg)) scale(var(--hs,1));
    transition:transform .12s ease-out;
  }
  #ball .eye{
    position:absolute;width:4.2px;height:4.4px;border-radius:50%;
    transform:translate(-50%,-50%);display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 50% 40%, #fdfefe 0%, #f7fbfc 72%, #eef6f7 100%);
    box-shadow:inset 0 0 1px rgba(6,66,110,.08);
    transition:height .09s ease;
  }
  #ball .eye.left{left:30.46px;top:28.08px}
  #ball .eye.right{left:41.58px;top:28.08px}
  #ball .pupil{
    width:2.4px;height:2.8px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #10537f 0%, #074067 55%, #042a44 100%);
    transform:translate(calc(var(--px,0)*1px),calc(var(--py,0)*1px));
    transition:transform .12s ease-out;
  }
  #ball.is-blink .eye{height:.9px}
  #ball.is-blink .pupil{opacity:.5}
  /* 状态联动：聆听时瞳孔放大、思考时左右扫视 */
  #ball[data-state="listening"] .pupil{transform:translate(calc(var(--px,0)*1px),calc(var(--py,0)*1px)) scale(1.14)}
  #ball[data-state="listening"]::before{animation-duration:2.4s;opacity:.85}
  #ball[data-state="thinking"] .pupil{animation:asgScan 1.5s ease-in-out infinite}
  #ball[data-state="thinking"]::before{animation-duration:1.1s;opacity:1}
  @keyframes asgScan{
    0%,100%{transform:translate(calc(var(--px,0)*1px - .7px),calc(var(--py,0)*1px))}
    50%{transform:translate(calc(var(--px,0)*1px + .7px),calc(var(--py,0)*1px))}
  }
  /* 常驻：一圈很慢的青色弧线，静止时也能看出这是可交互的入口 */
  #ball::before{
    content:"";position:absolute;inset:3px;border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(15,163,163,0) 0deg,
      rgba(15,163,163,0) 205deg,
      rgba(15,163,163,.60) 315deg,
      rgba(15,163,163,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    opacity:.55;
    animation:asgRing 9s linear infinite;
    pointer-events:none;
  }
  /* 悬停：主弧线加快，再叠一圈反向弧线，和静止态区分开 */
  #ball:hover::before{opacity:1;animation-duration:1.8s}
  #ball .ring{
    position:absolute;inset:1px;border-radius:50%;pointer-events:none;opacity:0;
    background:conic-gradient(from 180deg,
      rgba(11,111,114,0) 0deg,
      rgba(11,111,114,0) 225deg,
      rgba(11,111,114,.78) 330deg,
      rgba(11,111,114,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    transition:opacity .18s ease;
  }
  #ball:hover .ring{opacity:1;animation:asgRing 2.6s linear infinite reverse}
  /* 在线标：绿点 + 白描边；呼吸光环用独立元素做缩放，走合成层不占 CPU */
  #ball::after{
    content:"";position:absolute;right:12px;bottom:12px;width:10px;height:10px;
    border-radius:50%;background:#00d093;border:2px solid #fff;box-sizing:content-box;
  }
  #ball .halo{
    position:absolute;right:14px;bottom:14px;width:10px;height:10px;border-radius:50%;
    background:rgba(0,208,147,.45);pointer-events:none;
    animation:asgHalo 2.6s ease-out infinite;
  }
  @keyframes asgRing{to{transform:rotate(360deg)}}
  @keyframes asgBreath{
    0%,100%{
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.95),
        inset 0 -8px 14px rgba(11,111,114,.12),
        0 2px 5px rgba(20,35,60,.14),
        0 8px 18px rgba(15,140,150,.16);
    }
    50%{
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.95),
        inset 0 -8px 14px rgba(11,111,114,.20),
        inset 0 0 12px 1px rgba(15,163,163,.22),
        0 3px 7px rgba(20,35,60,.15),
        0 10px 22px rgba(15,140,150,.24);
    }
  }
  @keyframes asgHalo{
    0%{transform:scale(1);opacity:.6}
    70%{transform:scale(2.4);opacity:0}
    100%{transform:scale(2.4);opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    #ball{animation:none;transition:none}
    #ball::before{animation:none}
    #ball:hover::before{animation:none}
    #ball .ring{animation:none}
    #ball .halo{animation:none;opacity:0}
  }
</style>
</head>
<body>
  <div id="ball" data-state="idle" aria-label="问阿盛：点击打开对话，拖动可移动，右键有菜单">
    <i class="halo" aria-hidden="true"></i>
    <i class="ring" aria-hidden="true"></i>
    <img src="asg-logo.png" alt="阿盛">
    <span class="face" aria-hidden="true">
      <i class="eye left"><b class="pupil"></b></i>
      <i class="eye right"><b class="pupil"></b></i>
    </span>
  </div>
<script>
(function(){
  var el = document.getElementById('ball');
  var api = window.__TAURI__ || {};
  var invoke = api.core && api.core.invoke;
  var win = api.window && api.window.getCurrentWindow ? api.window.getCurrentWindow() : null;

  var sx = 0, sy = 0, dragging = false, pressed = false, resetTimer = null;

  el.addEventListener('mousedown', function(e){
    if (e.button !== 0) return;
    e.preventDefault();
    pressed = true; dragging = false;
    sx = e.screenX; sy = e.screenY;
  });

  window.addEventListener('mousemove', function(e){
    if (!pressed || dragging) return;
    if (Math.abs(e.screenX - sx) > 4 || Math.abs(e.screenY - sy) > 4) {
      dragging = true;
      if (win && win.startDragging) win.startDragging().catch(function(){});
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){ pressed = false; dragging = false; }, 1200);
    }
  });

  window.addEventListener('mouseup', function(){
    if (!pressed) return;
    pressed = false;
    if (!dragging && invoke) { invoke('toggle_panel').catch(function(){}); }
    dragging = false;
  });

  el.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if (invoke) { invoke('ball_menu').catch(function(){}); }
  });

  /* -------- 眼神跟随 / 眨眼 / 状态联动 -------- */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = { x: 0, y: 0 };
  var cur = { x: 0, y: 0 };
  var raf = 0;

  function frame() {
    cur.x += (target.x - cur.x) * 0.18;
    cur.y += (target.y - cur.y) * 0.18;
    el.style.setProperty('--px', (cur.x * 0.85).toFixed(2));
    el.style.setProperty('--py', (cur.y * 0.75).toFixed(2));
    el.style.setProperty('--hx', (cur.x * 1.6).toFixed(2));
    el.style.setProperty('--hy', (cur.y * 1.4).toFixed(2));
    el.style.setProperty('--hr', (cur.x * 3).toFixed(2));
    raf = Math.abs(target.x - cur.x) > 0.01 || Math.abs(target.y - cur.y) > 0.01
      ? requestAnimationFrame(frame) : 0;
  }

  function aim(clientX, clientY) {
    var r = el.getBoundingClientRect();
    var dx = (clientX - (r.left + r.width / 2)) / (r.width / 2);
    var dy = (clientY - (r.top + r.height / 2)) / (r.height / 2);
    target.x = Math.max(-1, Math.min(1, dx));
    target.y = Math.max(-1, Math.min(1, dy));
    if (!raf && !reduce) raf = requestAnimationFrame(frame);
  }

  function rest() {
    target.x = 0; target.y = 0;
    if (!raf && !reduce) raf = requestAnimationFrame(frame);
  }

  window.addEventListener('mousemove', function(e){ aim(e.clientX, e.clientY); });
  window.addEventListener('mouseleave', rest);
  window.addEventListener('blur', rest);

  function blink() {
    if (reduce) return;
    el.classList.add('is-blink');
    setTimeout(function(){ el.classList.remove('is-blink'); }, 120);
    var wait = 2600 + Math.random() * 3800;
    if (Math.random() < 0.22) {
      setTimeout(function(){
        el.classList.add('is-blink');
        setTimeout(function(){ el.classList.remove('is-blink'); }, 110);
      }, 220);
    }
    setTimeout(blink, wait);
  }
  setTimeout(blink, 1800 + Math.random() * 2000);

  /* 供 Rust 侧推送：idle / listening / thinking */
  window.__asgState = function(s) {
    el.setAttribute('data-state', s === 'listening' || s === 'thinking' ? s : 'idle');
  };
})();
</script>
</body>
</html>
